<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Qubit Visualization</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <div id="canvas"></div>
    
    <div id="shader-controls">
        <h2>Shader Controls</h2>
        <div class="shader-toggle">
            <label><input type="checkbox" id="toggle-plasma" checked> Plasma Shader</label>
        </div>
        <div class="shader-toggle">
            <label><input type="checkbox" id="toggle-qubit" checked> Qubit Shader</label>
        </div>
        <div class="shader-toggle">
            <label><input type="checkbox" id="toggle-orbital" checked> Orbital Shader</label>
        </div>
    </div>
    
    <div id="spacing-controls">
        <h2>Qubit Spacing</h2>
        <input type="range" id="spacing" min="3" max="10" value="8.5" step="0.5">
        <div class="value-display" id="spacingValue">8.5</div>
    </div>
    
    <div id="sound-controls">
        <h2>Quantum Sound</h2>
        <div class="shader-toggle">
            <label><input type="checkbox" id="toggle-sound"> Enable Sound</label>
        </div>
        <div class="sound-control">
            <label>Master Volume</label>
            <input type="range" id="sound-volume" min="0" max="100" value="30" step="1">
            <div class="value-display" id="volume-value">30%</div>
        </div>
        <div class="sound-control">
            <label>Bass Depth</label>
            <input type="range" id="sound-bass" min="0" max="100" value="50" step="1">
            <div class="value-display" id="bass-value">50%</div>
        </div>
        <div class="sound-control">
            <label>Resonance</label>
            <input type="range" id="sound-resonance" min="0" max="100" value="50" step="1">
            <div class="value-display" id="resonance-value">50%</div>
        </div>
    </div>

    <div id="quantum-state">
        <h2>Quantum State</h2>
        <div id="qubit-states"></div>
    </div>
    
    <div id="circuit-panel">
        <h2>Circuit Control</h2>
        <select id="circuit-mode" style="width:100%;padding:6px;margin:10px 0;background:#002222;color:#00ffff;border:1px solid #00ffff;border-radius:5px;font-size:11px;">
            <option value="manual">Manual Control</option>
            <option value="bell_state">Bell State</option>
            <option value="phase_evolution">Phase Evolution</option>
            <option value="random_rotation">Random Rotation</option>
        </select>
        
        <div id="manual-controls" style="display:block;">
            <div id="manual-qubits"></div>
        </div>
        
        <div id="circuit-mode-controls" style="display:none;">
            <img id="circuit-diagram-img" src="" alt="Circuit" style="display:none;width:100%;border-radius:5px;background:white;padding:5px;margin-bottom:10px;">
            <div id="circuit-progress">
                <div id="circuit-progress-bar"></div>
            </div>
            <div id="current-gate">No gate executed</div>
            <button id="next-gate">Next Gate</button>
            <button id="reset-circuit">Reset Circuit</button>
            <button id="auto-execute">Auto Execute</button>
        </div>
    </div>
    
    <div id="controls">
        <h2>Mic Controls</h2>
        <div id="mic-controls"></div>
        <button id="reset">Reset</button>
    </div>

    <div id="info">
        <div>Quantum Circuit Visualization</div>
        <div id="state-info"></div>
    </div>
    
    <div id="view-controls">
        <button id="toggle-ui">Hide UI</button>
        <button id="toggle-theme">Light Mode</button>
    </div>
    
    <div id="background-overlay"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="src/js/main.js"></script>
</body>
</html>
