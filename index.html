<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Qubit Visualization</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>

<body>
    <div id="canvas"></div>

    <div class="ui-column left">
        <div id="spacing-controls" class="ui-panel">
            <div class="panel-header">
                <h2>Configuration</h2>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="panel-content">
                <div class="sound-control">
                    <label>Qubit Spacing</label>
                    <input type="range" id="spacing" min="3" max="10" value="8.5" step="0.5">
                    <div class="value-display" id="spacingValue">8.5</div>
                </div>
                <div class="shader-toggle" style="margin-top:10px;">
                    <label><input type="checkbox" id="toggle-edge-mask" checked> Edge Masking</label>
                </div>
                <div id="edge-mask-controls">
                    <div class="sound-control">
                        <label>Mask Intensity</label>
                        <input type="range" id="mask-intensity" min="0" max="100" value="100" step="1">
                        <div class="value-display" id="maskIntensityValue">100%</div>
                    </div>
                    <div class="sound-control">
                        <label>Mask Size</label>
                        <input type="range" id="mask-size" min="0" max="600" value="200" step="5">
                        <div class="value-display" id="maskSizeValue">200px</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="sound-controls" class="ui-panel">
            <div class="panel-header">
                <h2>Quantum Sound</h2>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="panel-content">
                <div class="shader-toggle">
                    <button id="start-sound"
                        style="width:100%;padding:8px;background:#004444;color:#00ffff;border:1px solid #00ffff;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px;">Start
                        Quantum Sound</button>
                </div>
                <div class="shader-toggle" style="margin-top:10px;">
                    <label style="display:block;margin-bottom:5px;font-size:10px;">Input Device</label>
                    <select id="mic-device"
                        style="width:100%;padding:5px;background:#002222;color:#00ffff;border:1px solid #00ffff;border-radius:5px;font-size:10px;margin-bottom:10px;">
                        <option value="">Default Device</option>
                    </select>
                    <button id="start-mic"
                        style="width:100%;padding:8px;background:#004444;color:#00ffff;border:1px solid #00ffff;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px;">Start
                        Live Mic (Input)</button>
                </div>
                <div class="sound-control">
                    <label>Master Volume</label>
                    <input type="range" id="sound-volume" min="0" max="100" value="30" step="1">
                    <div class="value-display" id="volume-value">30%</div>
                </div>
                <div class="sound-control">
                    <label>AI Loops Volume</label>
                    <input type="range" id="ai-volume" min="0" max="100" value="50" step="1">
                    <div class="value-display" id="ai-volume-value">50%</div>
                </div>
                <div class="sound-control">
                    <label>Gate Sound Volume</label>
                    <input type="range" id="gate-volume" min="0" max="100" value="50" step="1">
                    <div class="value-display" id="gate-volume-value">50%</div>
                </div>
                <div class="sound-control">
                    <label>Entanglement Volume</label>
                    <input type="range" id="entanglement-volume" min="0" max="100" value="50" step="1">
                    <div class="value-display" id="entanglement-volume-value">50%</div>
                </div>

                <div class="sound-control" style="margin-top:10px; border-top: 1px solid #004444; padding-top: 10px;">
                    <label style="display:block;margin-bottom:5px;font-size:10px;color:#00ffff;">Sound
                        Personalization</label>

                    <div style="margin-bottom:8px;">
                        <label style="font-size:9px;color:#aaa;">Gate Sound Style</label>
                        <select id="gate-sound-style"
                            style="width:100%;padding:4px;background:#002222;color:#00ffff;border:1px solid #00ffff;border-radius:3px;font-size:10px;">
                            <option value="digital">Digital (FM Blip)</option>
                            <option value="crystalline">Crystalline (Sine)</option>
                            <option value="organic">Organic (Soft)</option>
                        </select>
                    </div>

                    <div style="margin-bottom:8px;">
                        <label style="font-size:9px;color:#aaa;">Entanglement Style</label>
                        <select id="entanglement-style"
                            style="width:100%;padding:4px;background:#002222;color:#00ffff;border:1px solid #00ffff;border-radius:3px;font-size:10px;">
                            <option value="drone">Deep Drone</option>
                            <option value="vibrant">Vibrant Pulse</option>
                            <option value="shimmer">Ethereal Shimmer</option>
                        </select>
                    </div>

                    <div style="margin-bottom:8px;">
                        <label style="font-size:9px;color:#aaa;">Collapse/Measure Sound</label>
                        <select id="collapse-style"
                            style="width:100%;padding:4px;background:#002222;color:#00ffff;border:1px solid #00ffff;border-radius:3px;font-size:10px;">
                            <option value="thud">Deep Thud (Recommended)</option>
                            <option value="glass">Glass Break</option>
                            <option value="static">Radio Static (Noisy)</option>
                        </select>
                    </div>
                </div>
                <div class="sound-control" style="margin-top:15px; border-top: 1px solid #004444; padding-top: 15px;">
                    <label style="display:block;margin-bottom:5px;font-size:10px;color:#00ffff;">🛡️ Smart Adaptive
                        Cancellation</label>
                    <div id="calibration-status-text" style="color:#00ff00;font-size:9px;text-align:center;">Real-Time
                        Echo Suppression Active</div>
                </div>
            </div>
        </div>
    </div>

    <div class="ui-column right">
        <div id="shader-controls" class="ui-panel collapsed">
            <div class="panel-header">
                <h2>Shader Controls</h2>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="panel-content">
                <div class="shader-toggle">
                    <label><input type="checkbox" id="toggle-plasma" checked> Plasma Shader</label>
                </div>
                <div class="shader-toggle">
                    <label><input type="checkbox" id="toggle-qubit" checked> Qubit Shader</label>
                </div>
                <div class="shader-toggle">
                    <label><input type="checkbox" id="toggle-clouds"> Quantum Clouds</label>
                </div>
                <div class="shader-toggle">
                    <label><input type="checkbox" id="toggle-seamless"> Seamless Mode (3D)</label>
                </div>
                <div class="shader-toggle">
                    <label><input type="checkbox" id="toggle-orbital" checked> Particle System</label>
                </div>
                <div class="shader-toggle">
                    <label><input type="checkbox" id="toggle-entanglement" checked> Mic Ripples</label>
                </div>
                <div class="shader-toggle">
                    <label><input type="checkbox" id="toggle-accretion"> Accretion Disc</label>
                </div>
                <div class="shader-toggle">
                    <label><input type="checkbox" id="toggle-lensing" checked> Gravitational Lensing</label>
                </div>
                <div class="shader-toggle">
                    <label><input type="checkbox" id="toggle-bloom" checked> Bloom</label>
                </div>
                <div class="shader-toggle">
                    <label><input type="checkbox" id="toggle-einstein"> Einstein Rings</label>
                </div>
                <!-- Godrays Toggle -->
                <div class="shader-toggle">
                    <label><input type="checkbox" id="toggle-godrays"> Godrays (Collapse)</label>
                </div>
            </div>
        </div>

        <div id="quantum-state" class="ui-panel collapsed">
            <div class="panel-header">
                <h2>Quantum State</h2>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="panel-content">
                <div id="qubit-states"></div>
            </div>
        </div>

        <div id="circuit-panel" class="ui-panel">
            <div class="panel-header">
                <h2>Circuit Control</h2>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="panel-content">
                <select id="circuit-mode"
                    style="width:100%;padding:6px;margin:10px 0;background:#002222;color:#00ffff;border:1px solid #00ffff;border-radius:5px;font-size:11px;">
                    <option value="">Select Circuit...</option>
                    <option value="random_quantum" selected>Random Quantum Mode</option>
                    <option value="manual">Manual Control</option>
                    <option value="bell_state">Bell State</option>
                    <option value="phase_evolution">Phase Evolution</option>
                    <option value="random_rotation">Random Rotation</option>
                    <option value="quantum_chaos">Quantum Chaos</option>
                </select>

                <div class="sound-control" style="margin: 10px 0; border-top: 1px solid #004444; padding-top: 10px;">
                    <label>Step Delay (Random/Auto)</label>
                    <input type="range" id="auto-speed" min="100" max="3000" value="1000" step="100">
                    <div class="value-display" id="speed-value">1.0s</div>
                </div>

                <div id="manual-controls" style="display:none;">
                    <div id="manual-qubits"></div>
                </div>

                <div id="circuit-mode-controls" style="display:none;">
                    <img id="circuit-diagram-img" src="" alt="Circuit"
                        style="display:none;max-width:160px;width:auto;border-radius:5px;background:white;padding:5px;margin-bottom:10px;">
                    <div id="circuit-progress">
                        <div id="circuit-progress-bar"></div>
                    </div>
                    <div id="current-gate">No gate executed</div>



                    <div class="shader-toggle" style="margin-bottom: 10px;">
                        <label><input type="checkbox" id="toggle-loop" checked> Loop Circuit</label>
                    </div>

                    <button id="next-gate">Next Gate</button>
                    <button id="reset-circuit">Reset Circuit</button>
                    <button id="auto-execute">Auto Execute</button>
                </div>
            </div>
        </div>

        <div id="controls" class="ui-panel collapsed">
            <div class="panel-header">
                <h2>Mic Controls</h2>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="panel-content">
                <div id="mic-controls"></div>
                <button id="reset">Reset</button>
            </div>
        </div>

    </div>


    <div id="view-controls">
        <button id="toggle-ui">Hide UI</button>
        <button id="toggle-theme">Light Mode</button>
    </div>

    <div id="edge-mask-overlay"></div>
    <div id="background-overlay"></div>

    <!-- Tone.js will be loaded dynamically -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "tone": "https://esm.sh/tone@14.8.49"
        }
    }
    </script>
    <script type="module" src="src/js/main.js?v=godrays_v1002"></script>
</body>

</html>
