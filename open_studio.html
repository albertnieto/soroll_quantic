<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Studio - STL Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(15, 15, 15, 0.7);
            --accent-color: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.3);
            --text-main: #f0f0f0;
            --text-dim: #a0a0a0;
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(12px);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
        }

        #ui-panel {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 320px;
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 10;
            transition: transform 0.3s ease;
        }

        header {
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .upload-area p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .upload-area .icon {
            font-size: 2rem;
            margin-bottom: 10px;
            display: block;
        }

        #file-input {
            display: none;
        }

        .control-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        input[type="range"] {
            flex-grow: 1;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            appearance: none;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .color-picker-wrapper {
            position: relative;
            width: 100%;
        }

        input[type="color"] {
            width: 100%;
            height: 36px;
            border: none;
            border-radius: 8px;
            background: none;
            cursor: pointer;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }

        .toggle-switch {
            width: 36px;
            height: 20px;
            background: var(--border-color);
            border-radius: 10px;
            position: relative;
            transition: background 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-input:checked+.toggle-switch {
            background: var(--accent-color);
        }

        .toggle-input:checked+.toggle-switch::after {
            transform: translateX(16px);
        }

        .toggle-input {
            display: none;
        }

        button.primary-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button.primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--accent-glow);
            filter: brightness(1.1);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            margin-top: 20px;
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-color);
            border-bottom-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            #ui-panel {
                top: auto;
                bottom: 20px;
                left: 20px;
                right: 20px;
                width: auto;
            }
        }
    </style>
</head>

<body>
    <div id="loading-overlay">
        <span class="loader"></span>
        <p style="margin-top: 20px; font-family: 'Outfit'; font-weight: 300; letter-spacing: 0.2em;">INITIALIZING STUDIO
        </p>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-panel">
        <header>
            <h1>Open Studio</h1>
            <div class="subtitle">3D STL Workspace</div>
        </header>

        <div class="upload-area" id="drop-zone">
            <span class="icon">📂</span>
            <p>Click or Drag STL file</p>
            <input type="file" id="file-input" accept=".stl">
        </div>

        <div class="control-group">
            <label>Material Appearance</label>
            <div class="color-picker-wrapper">
                <input type="color" id="color-picker" value="#00d2ff">
            </div>
        </div>

        <div class="control-group">
            <div class="control-row">
                <div class="toggle-container">
                    <input type="checkbox" id="wireframe-toggle" class="toggle-input">
                    <div class="toggle-switch"></div>
                    <span style="font-size: 0.8rem;">Wireframe</span>
                </div>
                <div class="toggle-container">
                    <input type="checkbox" id="auto-rotate-toggle" class="toggle-input">
                    <div class="toggle-switch"></div>
                    <span style="font-size: 0.8rem;">Auto-Rotate</span>
                </div>
            </div>
        </div>

        <div class="control-group">
            <label for="opacity-slider">Opacity</label>
            <div class="control-row">
                <input type="range" id="opacity-slider" min="0" max="1" step="0.01" value="1">
            </div>
        </div>

        <div class="control-group">
            <button class="primary-btn" id="reset-view">RESET CAMERA</button>
        </div>

        <div id="file-info" class="status-badge">No file loaded</div>
    </div>

    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="src/js/open_studio.js"></script>
</body>

</html>
