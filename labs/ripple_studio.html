<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple Studio - STL Exporter</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .panel {
            position: absolute;
            top: 20px;
            width: 280px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }

        #left-panel {
            left: 20px;
        }

        #ui-panel {
            right: 20px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #00ffff;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .value-display {
            font-size: 0.8rem;
            color: #aaa;
            text-align: right;
            margin-top: 2px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        button:hover {
            background: #0088ff;
        }

        .info {
            font-size: 0.8rem;
            color: #888;
            margin-top: 10px;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <div id="left-panel" class="panel">
        <h1>Material & World</h1>

        <div class="control-group">
            <label for="theme-select">Background Theme</label>
            <select id="theme-select"
                style="width:100%; padding:5px; background:#222; color:#eee; border:1px solid #444; border-radius:4px;">
                <option value="light">Studio White</option>
                <option value="dark">Cinematic Dark</option>
            </select>
        </div>

        <div class="control-group">
            <label for="color-picker">Mesh Color</label>
            <input type="color" id="color-picker" value="#00aaff"
                style="width:100%; height:30px; border:none; border-radius:4px; background:#333; cursor:pointer;">
        </div>

        <div class="control-group">
            <label for="material-select">Material Type</label>
            <select id="material-select"
                style="width:100%; padding:5px; background:#222; color:#eee; border:1px solid #444; border-radius:4px;">
                <option value="standard">Standard Solid</option>
                <option value="wireframe">Holographic Wireframe</option>
                <option value="points">Quantum Points</option>
                <option value="glass">Iridium Glass</option>
            </select>
        </div>

        <div class="control-group">
            <label for="roughness-slider">Roughness</label>
            <input type="range" id="roughness-slider" min="0" max="1" value="0.4" step="0.05">
        </div>

        <div class="control-group">
            <label for="metalness-slider">Metalness</label>
            <input type="range" id="metalness-slider" min="0" max="1" value="0.2" step="0.05">
        </div>

        <div class="control-group">
            <label for="rotation-slider">Auto-Rotation Speed</label>
            <input type="range" id="rotation-slider" min="0" max="5" value="0.0" step="0.1">
        </div>

        <div class="control-group">
            <label style="color:#00ffff; border-top:1px solid #333; padding-top:10px; margin-top:10px;">Lighting
                Setup</label>
        </div>

        <div class="control-group">
            <label for="ambient-slider">Ambient Light (Fill Shadows)</label>
            <input type="range" id="ambient-slider" min="0" max="10" value="4" step="0.5">
        </div>

        <div class="control-group">
            <label for="key-light-slider">Key Light (Main Shadows)</label>
            <input type="range" id="key-light-slider" min="0" max="10" value="3" step="0.5">
        </div>
    </div>

    <div id="ui-panel" class="panel">
        <h1>Geometry & FX</h1>

        <div class="control-group">
            <label for="primitive-select">Base Shape</label>
            <select id="primitive-select"
                style="width:100%; padding:5px; background:#222; color:#eee; border:1px solid #444; border-radius:4px;">
                <option value="sphere">Quantum Sphere</option>
                <option value="torus">Cyber Torus</option>
                <option value="knot">Dimensional Knot</option>
                <option value="plane">Geometric Plane</option>
                <option value="box">Abstract Box</option>
                <option value="capsule">Cyber Capsule</option>
                <option value="cylinder">Hyper Cylinder</option>
                <option value="ashtray">Designer Ashtray</option>
            </select>
        </div>

        <div class="control-group">
            <label for="modifier-select">Structural FX</label>
            <select id="modifier-select"
                style="width:100%; padding:5px; background:#222; color:#eee; border:1px solid #444; border-radius:4px;">
                <option value="none">Solid Structure</option>
                <option value="explode">Face Explosion</option>
                <option value="jitter">Low-Poly Crunch</option>
                <option value="magnetic">Magnetic Warp</option>
                <option value="voxel">Voxelize</option>
                <option value="liquid">Liquid Flow</option>
            </select>
        </div>

        <div class="control-group">
            <label for="math-mode-select">Surface Math</label>
            <select id="math-mode-select"
                style="width:100%; padding:5px; background:#222; color:#eee; border:1px solid #444; border-radius:4px;">
                <option value="noise">Classic Noise</option>
                <option value="golden">Golden Ratio</option>
                <option value="quantum">Quantum Waves</option>
                <option value="sine">Geometric Sine</option>
                <option value="vortex">Cosmic Vortex</option>
                <option value="cellular">Fractal Cells</option>
                <option value="interference">Moire Interference</option>
                <option value="pulse">Pulse Core</option>
                <option value="twister">Hyper-Twister</option>
                <option value="glitch">Digital Glitch</option>
                <option value="shattered">Shattered Shell</option>
                <option value="jagged">Jagged Fracture</option>
            </select>
        </div>

        <div class="control-group">
            <label for="time-slider">Animation Frame (Time)</label>
            <input type="range" id="time-slider" min="0" max="100" value="0" step="0.1">
            <div class="value-display" id="time-display">0.0</div>
        </div>

        <div class="control-group">
            <label for="strength-slider">Deformation Strength</label>
            <input type="range" id="strength-slider" min="0" max="4" value="0.5" step="0.05">
            <div class="value-display" id="strength-display">0.5</div>
        </div>

        <div class="control-group">
            <label for="resolution-slider">Mesh Resolution</label>
            <input type="range" id="resolution-slider" min="32" max="512" value="256" step="16">
            <div class="value-display" id="resolution-display">256</div>
        </div>

        <div class="control-group">
            <label for="thickness-slider">Wall Thickness</label>
            <input type="range" id="thickness-slider" min="0.05" max="1.0" value="0.2" step="0.05">
            <div class="value-display" id="thickness-display">0.20</div>
        </div>

        <div class="control-group">
            <label for="split-select">Split (Cake Slices)</label>
            <select id="split-select"
                style="width:100%; padding:5px; background:#222; color:#eee; border:1px solid #444; border-radius:4px;">
                <option value="1">1 (Full Sphere)</option>
                <option value="2">2 Halves</option>
                <option value="3">3 Thirds</option>
                <option value="4">4 Quarters</option>
                <option value="5">5 Fifths</option>
            </select>
        </div>

        <div class="control-group" id="piece-group" style="display:none;">
            <label for="piece-select">Select Piece to Export</label>
            <select id="piece-select"
                style="width:100%; padding:5px; background:#222; color:#eee; border:1px solid #444; border-radius:4px;">
                <option value="0">Piece 1</option>
            </select>
        </div>

        <div class="control-group">
            <button id="export-btn">Export STL</button>
        </div>

        <div class="info">
            Adjust the sliders to find the perfect ripple shape. "Export STL" will save the current 3D geometry exactly
            as seen.
        </div>
    </div>

    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="js/ripple_studio.js"></script>
</body>

</html>
